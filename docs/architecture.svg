<svg width="680" height="700" viewBox="0 0 680 700" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Self-healing LLM gateway request flow</title>
<desc>A request from an OpenAI client enters the gateway, passes a required-metadata gate (rejected 400 if tenant or feature is missing), reaches a failover router over a pool of four providers each guarded by its own circuit breaker and normalized by LiteLLM, then a cost record is logged and an OpenAI-shaped response is returned. A legend shows the circuit breaker's closed, open, and half-open states.</desc>
<style>
text{font-family:'Anthropic Sans',system-ui,-apple-system,sans-serif;}
.th{font-size:14px;font-weight:500;}
.ts{font-size:12px;font-weight:400;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="700" fill="#ffffff"/>

<rect x="210" y="44" width="260" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="340" y="66" text-anchor="middle" fill="#2C2C2A">client app</text>
<text class="ts" x="340" y="82" text-anchor="middle" fill="#5F5E5A">OpenAI SDK · sets base_url + headers</text>

<line x1="340" y1="90" x2="340" y2="116" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="116" width="260" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="340" y="138" text-anchor="middle" fill="#26215C">metadata gate</text>
<text class="ts" x="340" y="154" text-anchor="middle" fill="#534AB7">tenant · feature · request-id</text>

<line x1="470" y1="139" x2="498" y2="139" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="498" y="116" width="132" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text class="th" x="564" y="138" text-anchor="middle" fill="#501313">reject · 400</text>
<text class="ts" x="564" y="154" text-anchor="middle" fill="#A32D2D">missing metadata</text>

<line x1="340" y1="162" x2="340" y2="188" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="188" width="260" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="340" y="210" text-anchor="middle" fill="#26215C">router</text>
<text class="ts" x="340" y="226" text-anchor="middle" fill="#534AB7">tries pool in order · failover</text>

<line x1="340" y1="234" x2="340" y2="258" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="120" y="258" width="440" height="120" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text class="th" x="140" y="279" text-anchor="start" fill="#2C2C2A">provider pool · LiteLLM</text>

<rect x="132" y="298" width="95" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="179" y="319" text-anchor="middle" fill="#04342C">ollama</text>
<text class="ts" x="179" y="336" text-anchor="middle" fill="#0F6E56">local · free</text>

<rect x="239" y="298" width="95" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="286" y="319" text-anchor="middle" fill="#04342C">openai</text>
<text class="ts" x="286" y="336" text-anchor="middle" fill="#0F6E56">cloud</text>

<rect x="346" y="298" width="95" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="393" y="319" text-anchor="middle" fill="#04342C">anthropic</text>
<text class="ts" x="393" y="336" text-anchor="middle" fill="#0F6E56">cloud</text>

<rect x="453" y="298" width="95" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="500" y="319" text-anchor="middle" fill="#04342C">gemini</text>
<text class="ts" x="500" y="336" text-anchor="middle" fill="#0F6E56">cloud</text>

<text class="ts" x="340" y="368" text-anchor="middle" fill="#5F5E5A">each provider has its own circuit breaker</text>

<line x1="340" y1="378" x2="340" y2="404" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="404" width="260" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="340" y="426" text-anchor="middle" fill="#26215C">cost record</text>
<text class="ts" x="340" y="442" text-anchor="middle" fill="#534AB7">tenant · feature · tokens · cost</text>

<line x1="340" y1="450" x2="340" y2="476" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="476" width="260" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="340" y="498" text-anchor="middle" fill="#2C2C2A">response</text>
<text class="ts" x="340" y="514" text-anchor="middle" fill="#5F5E5A">OpenAI-shaped · echoes request-id</text>

<rect x="120" y="546" width="440" height="124" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text class="th" x="140" y="568" text-anchor="start" fill="#2C2C2A">circuit breaker states</text>

<rect x="140" y="590" width="120" height="40" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="th" x="200" y="614" text-anchor="middle" fill="#173404">closed</text>

<line x1="262" y1="610" x2="298" y2="610" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="300" y="590" width="110" height="40" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text class="th" x="355" y="614" text-anchor="middle" fill="#501313">open</text>

<line x1="412" y1="610" x2="438" y2="610" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="440" y="590" width="120" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="th" x="500" y="614" text-anchor="middle" fill="#412402">half-open</text>

<text class="ts" x="340" y="654" text-anchor="middle" fill="#5F5E5A">trip on error rate or p95 latency · recover after cooldown</text>
</svg>
